version: "3.8"

services:
  ihostproxy:
    image: alexng353/ihostproxy
    container_name: ihostproxy
    ports:
      - "25661:1080"
      - "8081:8080"
    volumes:
      - v_ihostproxy:/db
    environment:
      - DB_PATH=/db/main.db
      - WEBUI_PASS
      - WEBUI_USER

volumes:
  v_ihostproxy:
